# AWS: org secrets (same as backend). Terraform runs from narwal-backend/infra checkout.
# See narwal-backend/docs/aws/github-org-secrets.md
name: Deploy frontend (AWS)

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Skip Terraform; test, build, and sync UI only"
        required: false
        default: false
        type: boolean
      backend_ref:
        description: "Git ref for narwal-backend infra (Terraform source)"
        required: false
        default: master
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VERSION: "1.9.8"
  UI_S3_PREFIX: ui
  BACKEND_REPO: Narwhal-TCC/narwal-backend

jobs:
  provisioning:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_only != true }}
    runs-on: ubuntu-latest
    outputs:
      app_s3_bucket: ${{ steps.export.outputs.app_s3_bucket }}
      ec2_instance_id: ${{ steps.export.outputs.ec2_instance_id }}
      app_public_url: ${{ steps.export.outputs.app_public_url }}
    steps:
      - name: Checkout backend infra
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_ref || 'master' }}
          path: narwal-backend
          sparse-checkout: |
            infra
            scripts/aws/create-app-bucket.sh
          sparse-checkout-cone-mode: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure app S3 bucket exists
        working-directory: narwal-backend
        env:
          APP_BUCKET_NAME: ${{ secrets.APP_BUCKET_NAME }}
        run: |
          set -euo pipefail
          bash scripts/aws/create-app-bucket.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure Terraform backend
        working-directory: narwal-backend
        env:
          STATE_BUCKET: ${{ secrets.STATE_BUCKET_NAME != '' && secrets.STATE_BUCKET_NAME || secrets.APP_BUCKET_NAME }}
        run: |
          set -euo pipefail
          cat > infra/backend.hcl <<EOF
          bucket = "${STATE_BUCKET}"
          key    = "terraform/narwal-app/state.tfstate"
          region = "${{ env.AWS_REGION }}"
          EOF

      - name: Terraform init and apply
        working-directory: narwal-backend
        env:
          APP_BUCKET_NAME: ${{ secrets.APP_BUCKET_NAME }}
        run: |
          set -euo pipefail
          terraform -chdir=infra init -backend-config=backend.hcl
          terraform -chdir=infra apply -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="app_bucket_name=${APP_BUCKET_NAME}"

      - name: Export Terraform outputs
        id: export
        working-directory: narwal-backend
        run: |
          set -euo pipefail
          echo "app_s3_bucket=$(terraform -chdir=infra output -raw app_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "ec2_instance_id=$(terraform -chdir=infra output -raw api_instance_id)" >> "$GITHUB_OUTPUT"
          echo "app_public_url=$(terraform -chdir=infra output -raw app_public_url)" >> "$GITHUB_OUTPUT"

  test-build-deploy:
    runs-on: ubuntu-latest
    needs: provisioning
    if: always() && !cancelled() && (needs.provisioning.result == 'success' || needs.provisioning.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Checkout backend infra (redeploy only)
        if: needs.provisioning.result == 'skipped'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_ref || 'master' }}
          path: narwal-backend
          sparse-checkout: infra
          sparse-checkout-cone-mode: true

      - name: Set up Terraform (redeploy only)
        if: needs.provisioning.result == 'skipped'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Resolve Terraform outputs
        id: tf
        run: |
          set -euo pipefail
          if [ "${{ needs.provisioning.result }}" = "success" ]; then
            echo "app_s3_bucket=${{ needs.provisioning.outputs.app_s3_bucket }}" >> "$GITHUB_OUTPUT"
            echo "ec2_instance_id=${{ needs.provisioning.outputs.ec2_instance_id }}" >> "$GITHUB_OUTPUT"
            echo "app_public_url=${{ needs.provisioning.outputs.app_public_url }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATE_BUCKET="${{ secrets.STATE_BUCKET_NAME != '' && secrets.STATE_BUCKET_NAME || secrets.APP_BUCKET_NAME }}"
          cat > narwal-backend/infra/backend.hcl <<EOF
          bucket = "${STATE_BUCKET}"
          key    = "terraform/narwal-app/state.tfstate"
          region = "${{ env.AWS_REGION }}"
          EOF
          terraform -chdir=narwal-backend/infra init -backend-config=backend.hcl
          echo "app_s3_bucket=$(terraform -chdir=narwal-backend/infra output -raw app_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "ec2_instance_id=$(terraform -chdir=narwal-backend/infra output -raw api_instance_id)" >> "$GITHUB_OUTPUT"
          echo "app_public_url=$(terraform -chdir=narwal-backend/infra output -raw app_public_url)" >> "$GITHUB_OUTPUT"

      - name: Upload build to S3 staging prefix
        env:
          APP_S3_BUCKET: ${{ steps.tf.outputs.app_s3_bucket }}
        run: |
          set -euo pipefail
          aws s3 sync dist/ "s3://${APP_S3_BUCKET}/${UI_S3_PREFIX}/" --delete

      - name: Sync UI onto EC2 via SSM
        env:
          INSTANCE_ID: ${{ steps.tf.outputs.ec2_instance_id }}
          APP_S3_BUCKET: ${{ steps.tf.outputs.app_s3_bucket }}
        run: |
          set -euo pipefail
          SSM_PARAMS=$(python3 -c "
          import json
          import os
          bucket = os.environ['APP_S3_BUCKET']
          prefix = os.environ.get('UI_S3_PREFIX', 'ui')
          script = f'''set -euo pipefail
          aws s3 sync s3://{bucket}/{prefix}/ /var/www/narwal/ --delete
          chown -R nginx:nginx /var/www/narwal
          systemctl reload nginx
          '''
          print(json.dumps({'commands': [script]}))
          ")
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Narwal UI deploy" \
            --parameters "${SSM_PARAMS}" \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "Status" --output text)
          if [ "${STATUS}" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "[StandardOutputContent, StandardErrorContent]" --output text >&2
            exit 1
          fi

      - name: Smoke UI origin
        env:
          APP_PUBLIC_URL: ${{ steps.tf.outputs.app_public_url }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' "${APP_PUBLIC_URL%/}/" || echo "000")
          echo "GET / → HTTP ${code}"
          test "${code}" = "200"
